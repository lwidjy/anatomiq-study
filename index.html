<script>
(()=>{'use strict';
const $=s=>document.querySelector(s), $$=s=>Array.from(document.querySelectorAll(s));
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const id=()=>typeof crypto!=='undefined'&&crypto.randomUUID?crypto.randomUUID():'id'+Date.now()+Math.random().toString(36).slice(2);
const normalize=s=>String(s||'').toLowerCase().normalize('NFKD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9 ]/g,'').replace(/\s+/g,' ').trim();
const short=(s,n=110)=>String(s||'').length>n?String(s).slice(0,n).trim()+'…':String(s||'');
const cap=s=>String(s||'').replace(/\b\w/g,c=>c.toUpperCase());
const shuffle=a=>[...a].sort(()=>Math.random()-.5);
let data={sources:[],diagrams:[],customCards:[],reviews:{},history:[]},db=null,active='home',editorId=null,quiz=null,flash={i:0,shown:false,order:[]},guideCache=null,toastTimer=null,pendingPin=null,storageGood=true;
const navs=[{id:'home',i:'⌂',n:'Home'},{id:'library',i:'▤',n:'Library'},{id:'diagrams',i:'◎',n:'Diagrams'},{id:'guide',i:'✦',n:'Study guide'},{id:'practice',i:'◇',n:'Practice'}];
function toast(msg){const e=$('#toast');e.textContent=msg;e.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>e.classList.remove('show'),2800)}
function navTo(dest){active=dest;editorId=null;render();window.scrollTo({top:0,behavior:'smooth'})}
function renderNav(){for(let [selector,mobile] of [['#sidebarNav',false],['#mobileNav',true]]){$(selector).innerHTML=navs.map(n=>`<button type="button" class="${active===n.id?(mobile?'on':'active'):''}" data-go="${n.id}" ${active===n.id?'aria-current="page"':''}><span class="sym">${n.i}</span>${mobile?n.n:`<span>${n.n}</span>`}</button>`).join('')};$$('[data-go]').forEach(b=>b.onclick=()=>navTo(b.dataset.go))}
function safeRender(){try{render()}catch(e){console.error(e);$('#page').innerHTML=`<div class="card"><h2>Something went wrong</h2><p>${esc(e.message)}</p><button class="btn" id="retry">Try again</button></div>`;$('#retry').onclick=render}}
function openDB(){return new Promise((resolve,reject)=>{if(!window.indexedDB)return reject(new Error('Storage unavailable'));const q=indexedDB.open('anatomiq-study-v1',1);q.onupgradeneeded=()=>q.result.createObjectStore('kv');q.onsuccess=()=>resolve(q.result);q.onerror=()=>reject(q.error)})}
function dbGet(key){return new Promise((res,rej)=>{const q=db.transaction('kv','readonly').objectStore('kv').get(key);q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error)})}
function dbPut(key,val){return new Promise((res,rej)=>{const tx=db.transaction('kv','readwrite');tx.objectStore('kv').put(val,key);tx.oncomplete=()=>res();tx.onerror=()=>rej(tx.error);tx.onabort=()=>rej(tx.error)})}
let saveTimer;function saveSoon(){clearTimeout(saveTimer);saveTimer=setTimeout(async()=>{if(!db)return;try{await dbPut('data',data);$('#saveStatus').textContent='✓ SAVED ON DEVICE';storageGood=true}catch(e){storageGood=false;console.warn(e);$('#saveStatus').textContent='! STORAGE FAILED';toast('Storage failed — export a backup and free device space.')}},250)}
function fileDownload(text,name,mime){const b=new Blob([text],{type:mime||'text/plain;charset=utf-8'}),u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),1500)}
function savedate(){return new Date().toISOString().slice(0,10)}
function cards(){let all=[...data.customCards.map(c=>({...c,source:c.source||'My cards'}))];for(const s of data.sources){const explicit=deriveCards(s.text,s.name);all.push(...explicit);if(explicit.length<3)all.push(...deriveSlideCards(s.text,s.name))}for(const d of data.diagrams){for(const pin of d.pins){if(pin.note&&pin.note.length>=8)all.push({id:'pin-'+pin.id,term:pin.label,definition:pin.note,source:'Diagram: '+d.name})}}const seen=new Set;return all.filter(c=>{const k=normalize(c.term+'::'+c.definition);if(seen.has(k))return false;seen.add(k);return !!c.term&&!!c.definition}).slice(0,350)}
function cleanLine(s){return s.replace(/^[-*•·●\d.)\s]+/,'').replace(/\s+/g,' ').trim()}
function deriveCards(text,source){const lines=String(text||'').split(/\r?\n/).map(cleanLine).filter(x=>x.length>10),out=[];for(const line of lines){if(line.length>340)continue;let m=line.match(/^([^:–—]{3,70}?)\s*(?::\s+|\s+[—–]\s+)(.{12,})$/);if(!m)m=line.match(/^([A-Z][a-zA-Z0-9 ()/\-]{2,65}?)\s+(?:is|are|refers to|means|consists of|contains)\s+(.{12,})$/i);if(m){let term=m[1].trim().replace(/\.$/,''),def=m[2].trim();if(term.split(' ').length<=9&&term.length>=3&&def.length>=12&&term!==source){out.push({id:'auto-'+normalize(source+term+def),term,definition:def,source})}}}return out.slice(0,120)}
function deriveSlideCards(text,source){const s=String(text||'');const chunks=s.split(/(?=^Slide \d+\s*$)/m).filter(x=>/^Slide \d+/.test(x.trim()));let result=[];for(const chunk of chunks){const lines=chunk.split(/\r?\n/).map(cleanLine).filter(x=>x&&x.length>3&&!/^Slide \d+$/.test(x));if(lines.length<2)continue;let title=lines[0].replace(/[:.]+$/,'');if(title.length>84||title.length<4)continue;const facts=lines.slice(1).filter(x=>x.length>=10&&x.length<=260).slice(0,4);if(!facts.length)continue;const def=facts.join('; ').slice(0,420);if(def.length<17)continue;result.push({id:'slide-'+normalize(source+title+def),term:title,definition:def,source})}return result.slice(0,80)}
function getFacts(t){return String(t||'').split(/\n|(?<=[.!?])\s+(?=[A-Z])/).map(cleanLine).filter(l=>l.length>=27&&l.length<=280&&!/^(slide \d+|page \d+)/i.test(l)).slice(0,150)}
function summary(){const cc=cards(),pins=data.diagrams.reduce((n,i)=>n+i.pins.length,0);return {cc,pins,files:data.sources.length+data.diagrams.length}}
function home(){const {cc,pins,files}=summary();return `<div class="hero"><span class="eyebrow">✦ Anatomy made understandable</span><h1>See it. Learn it.<br><span class="accent">Remember it.</span></h1><p>Turn your lecture slides, organ pictures, PDFs, and notes into your own interactive study space.</p><div class="actionrow"><button class="btn" data-go="library">＋ Add study material</button><button class="btn secondary" data-go="practice">Start practice →</button></div><div class="watermark">A</div></div><div class="stats"><div class="stat"><div class="statvalue">${files}</div><div class="statname">Materials & images</div></div><div class="stat"><div class="statvalue">${cc.length}</div><div class="statname">Learnable concepts</div></div><div class="stat"><div class="statvalue">${pins}</div><div class="statname">Diagram labels</div></div></div><div class="sectiontop"><h3>One place to study everything</h3></div><div class="grid3"><div class="card feature"><div class="featureIcon">📎</div><h3>Upload lectures</h3><p>Bring in PowerPoints, text PDFs, Word docs, notes, and images.</p></div><div class="card feature"><div class="featureIcon">🫀</div><h3>Study organs visually</h3><p>Add labels to photos, then test yourself by tapping structures.</p></div><div class="card feature"><div class="featureIcon">✍️</div><h3>More than A–B–C</h3><p>Mix written recall, blanks, matching, true/false and picture questions.</p></div></div><div class="sectiontop"><h3>Get started</h3><span class="tag mint">No account needed</span></div><div class="card"><div class="row spread"><div><h3>Try an anatomy example</h3><p class="mini" style="max-width:470px">Load sample heart vocabulary and a simple labeled diagram so you can try the study guide and every quiz style first.</p></div><button class="btn secondary" id="demo">Load demo</button></div></div><div class="notice" style="margin-top:18px">🔒 Everything stays in this browser. Download a backup regularly. Opening the site in another browser/device will not automatically copy your material.</div>`}
function library(){return `<span class="eyebrow">01 / Your materials</span><h2>Build your study library.</h2><p class="intro">Upload the professor's material first. AnatomIQ only makes study questions from the information you've provided.</p><div class="card"><input type="file" id="files" multiple hidden accept=".pdf,.pptx,.docx,.txt,.md,.csv,image/*"><div class="drop" id="drop" role="button" tabindex="0"><div class="big">↥</div><h3>Drop your lecture files here</h3><p>or tap to browse — PDF, PowerPoint, DOCX, TXT and organ photos</p><div style="margin-top:17px"><span class="btn small">Choose files</span></div></div><label class="row mini" style="margin-top:14px"><input type="checkbox" id="pdfVisual" checked> Also save the first 6 PDF pages as study diagrams (uses more device storage)</label><p class="mini" style="margin:10px 0 0">PDF / PowerPoint / Word text extraction uses third-party code downloaded from a CDN; internet is needed for those file types. Files themselves are processed locally. Scanned pages may have no extractable text.</p></div><div class="sectiontop"><h3>Or paste notes</h3></div><div class="card"><div class="field"><label class="label" for="notesTitle">Topic / lecture name</label><input id="notesTitle" class="input" placeholder="e.g. Cardiovascular anatomy — week 4"></div><div class="field"><label class="label" for="notesText">Notes, definitions, or key facts</label><textarea id="notesText" class="textarea" rows="6" placeholder="Aorta: carries blood from the left ventricle to the body.\nRight atrium: receives blood returning from the body.\n... (paste from your class notes)"></textarea></div><div class="row spread"><span class="mini">Best quiz results: include lines like <b>Structure: function</b>.</span><button class="btn" id="saveNotes">Save notes ＋</button></div></div><div class="sectiontop"><h3>Saved library</h3><span class="tag">${data.sources.length} documents · ${data.diagrams.length} images</span></div>${data.sources.length?`<div class="items">${data.sources.map(s=>`<div class="item"><div class="grow"><strong>▤ ${esc(s.name)}</strong><p>${esc(s.type)} · ${s.text.length.toLocaleString()} characters · ${deriveCards(s.text,s.name).length+deriveSlideCards(s.text,s.name).length} extracted review prompts</p></div><div class="row"><button class="btn small secondary" data-viewdoc="${esc(s.id)}">View</button><button class="btn small danger" data-delete-source="${esc(s.id)}">Remove</button></div></div>`).join('')}</div>`:`<div class="empty"><div class="emoji">📚</div><h3>Nothing uploaded yet</h3><p>Add your first slides, lecture notes or organ photo and we'll build your study library.</p></div>`}${data.diagrams.length?`<div class="sectiontop"><h3>Images in your library</h3></div><div class="grid3">${data.diagrams.slice(0,6).map(i=>`<button class="card" data-editdiagram="${esc(i.id)}" style="cursor:pointer;text-align:left;padding:12px"><img class="diagramThumb" src="${i.data}" alt="${esc(i.name)}"><strong style="display:block;margin-top:9px">${esc(short(i.name,34))}</strong><span class="mini">${i.pins.length} labels · Tap to annotate</span></button>`).join('')}</div>`:''}<div class="sectiontop"><h3>Back up your work</h3></div><div class="card"><p class="mini">Your data is stored locally (including compressed images). Exporting a backup is the safest way to move it to another browser or phone.</p><div class="actionrow"><button class="btn secondary" id="export">↓ Download backup</button><label class="btn ghost" for="backupFile">↑ Restore backup</label><input id="backupFile" type="file" accept=".json,application/json" hidden></div></div>`}
function diagrams(){return `<span class="eyebrow">02 / Visual memory</span><h2>Learn every structure.</h2><p class="intro">Upload a photo of an organ, tap each visible structure and name it. Then practice by identifying structures on the picture — no guessing from a random anatomy diagram.</p><div class="notice">✦ Images are not automatically identified. Add labels from your professor's slides or textbook, so quizzes stay grounded in the material you're studying.</div><div class="sectiontop"><h3>Your diagram collection</h3><button class="btn small" data-go="library">＋ Add image</button></div>${data.diagrams.length?`<div class="diagramGrid">${data.diagrams.map(i=>`<div class="card"><img class="diagramThumb" src="${i.data}" alt="${esc(i.name)}"><div class="row spread" style="margin-top:14px"><div><strong>${esc(short(i.name,42))}</strong><div class="mini">${i.pins.length} annotated structures</div></div><button class="btn small" data-editdiagram="${esc(i.id)}">Label →</button></div></div>`).join('')}</div>`:`<div class="empty"><div class="emoji">🧠</div><h3>Your organ atlas starts here</h3><p>Import a heart, kidney, brain, lung or any anatomy image. You can also load the demo from Home.</p><button class="btn" data-go="library">Upload organ photo</button></div>`}`}
function editDiagram(){const d=data.diagrams.find(x=>x.id===editorId);if(!d){editorId=null;return diagrams()}return `<div class="row spread" style="margin-bottom:18px"><button class="btn ghost small" id="backDia">← All diagrams</button><span class="tag mint">${d.pins.length} marked structures</span></div><span class="eyebrow">Interactive organ atlas</span><h2>${esc(d.name)}</h2><p>Type the structure's name, then tap its exact position on the picture to place a marker.</p><div class="card"><div class="formrow"><div class="field"><label class="label" for="pinName">Structure name</label><input class="input" id="pinName" placeholder="e.g. Left ventricle" maxlength="100"></div><div class="field"><label class="label" for="pinNote">Function / definition (optional)</label><input class="input" id="pinNote" placeholder="e.g. pumps blood into aorta" maxlength="260"></div><div class="field"><span class="label">Next step</span><span class="tag mint" style="padding:12px">Tap photo ↓</span></div></div><div class="imageEditor" id="markCanvas"><img src="${d.data}" alt="${esc(d.name)}">${d.pins.map((p,i)=>`<span class="pin" style="left:${p.x*100}%;top:${p.y*100}%">${i+1}</span>`).join('')}</div><p class="mini" style="margin:9px 0">Tip: If you tap the wrong spot, remove the marker below and add it again.</p><div class="sectiontop"><h3>Saved structures</h3></div><div class="markerList">${d.pins.map((p,i)=>`<span class="markerChip">${i+1}. ${esc(p.label)} <button aria-label="Remove ${esc(p.label)}" data-rmpin="${esc(p.id)}">✕</button></span>`).join('')||'<span class="mini">No labels yet. Add your first structure above.</span>'}</div><div class="actionrow"><button class="btn secondary" id="practiceDia" ${d.pins.length?'':'disabled'}>Test this diagram →</button><button class="btn danger" id="deleteDia">Delete image</button></div></div>`}
function organizeGuide(){const definitions=cards(),docSections=data.sources.map(s=>({name:s.name,facts:getFacts(s.text).slice(0,20),concepts:[...deriveCards(s.text,s.name),...(deriveCards(s.text,s.name).length<3?deriveSlideCards(s.text,s.name):[])].slice(0,22)}));const diagramsData=data.diagrams.map(d=>({name:d.name,pins:d.pins}));return {definitions,docSections,diagramsData}}
function guideHTML(printed=false){const g=organizeGuide();return `${printed?'<h1>AnatomIQ — Study Guide</h1><p>Created from your uploaded study materials · '+savedate()+'</p>':'<span class="eyebrow">03 / Study guide</span><h2>Your study guide.</h2><p class="intro">A source-based outline of definitions, important statements and image labels. Review against your lecture slides before using it as your exam reference.</p>'}${!g.docSections.length&&!g.diagramsData.length?`<div class="empty"><div class="emoji">📝</div><h3>Add material to generate your guide</h3><p>Upload lecture slides or paste notes in the Library. Nothing is invented when there's no source.</p>${printed?'':'<button class="btn" data-go="library">Go to Library</button>'}</div>`:`${g.docSections.map(s=>`<div class="guideSection ${printed?'':'card'}"><h3>${esc(s.name)}</h3>${s.concepts.length?`<div class="eyebrow" style="margin:13px 0 7px">Terms and definitions</div><ul class="guideList">${s.concepts.map(c=>`<li><strong>${esc(c.term)}:</strong> ${esc(c.definition)}</li>`).join('')}</ul>`:''}<div class="eyebrow" style="margin:17px 0 7px">Key statements from source</div><ul class="guideList">${s.facts.length?s.facts.slice(0,16).map(f=>`<li>${esc(f)}</li>`).join(''):'<li>No readable text found. For scanned slides, add notes or annotate the image.</li>'}</ul></div>`).join('')}${data.customCards.length?`<div class="guideSection ${printed?'':'card'}"><h3>Your added definitions</h3><ul class="guideList">${data.customCards.map(c=>`<li><strong>${esc(c.term)}:</strong> ${esc(c.definition)}</li>`).join('')}</ul></div>`:''}${g.diagramsData.filter(d=>d.pins.length).map(d=>`<div class="guideSection ${printed?'':'card'}"><h3>Diagram: ${esc(d.name)}</h3><ul class="guideList">${d.pins.map(p=>`<li><strong>${esc(p.label)}</strong>${p.note?`: ${esc(p.note)}`:''}</li>`).join('')}</ul></div>`).join('')}`}${printed?'':`<div class="notice" style="margin-top:16px">Important: This is an automatic outline of <em>your own</em> materials, not an AI-written medical explanation. Diagrams must be labeled by you. Verify every structure and statement against your course.</div><div class="actionrow noPrint"><button class="btn" id="printGuide">⎙ Print / Save as PDF</button><button class="btn secondary" id="downloadGuide">↓ Save as text</button><button class="btn ghost" data-go="practice">Practice now →</button></div>`}`}
function guideText(){const g=organizeGuide();let out='ANATOMIQ STUDY GUIDE\n'+savedate()+'\n\n';for(const s of g.docSections){out+=s.name.toUpperCase()+'\n\nTERMS\n'+s.concepts.map(c=>c.term+': '+c.definition).join('\n')+'\n\nSOURCE HIGHLIGHTS\n'+s.facts.slice(0,16).map(f=>'- '+f).join('\n')+'\n\n'}if(data.customCards.length)out+='MY DEFINITIONS\n'+data.customCards.map(c=>c.term+': '+c.definition).join('\n')+'\n\n';for(const d of g.diagramsData){out+='DIAGRAM: '+d.name+'\n'+d.pins.map(p=>p.label+(p.note?': '+p.note:'')).join('\n')+'\n\n'}return out}
function practice(){const cc=cards(),pinCount=summary().pins;return `<span class="eyebrow">04 / Active recall</span><h2>Stop rereading.<br><span class="accent">Start remembering.</span></h2><p class="intro">Questions are created from the definitions and diagram labels you provided, with different ways to recall the material.</p><div class="grid2"><div class="card"><div class="featureIcon">✦</div><h3>Build a quiz</h3><div class="field"><label class="label" for="quizMode">Question style</label><select class="select" id="quizMode"><option value="mixed">Mixed — all available formats</option><option value="written">Written / short answer</option><option value="fill">Fill in the blank</option><option value="matching">Matching</option><option value="truefalse">True or false</option><option value="mc">Multiple choice</option><option value="diagram">Tap the organ structure</option></select></div><div class="field"><label class="label" for="quizCount">Number of questions</label><select class="select" id="quizCount"><option value="5">5 questions</option><option value="10" selected>10 questions</option><option value="15">15 questions</option><option value="20">20 questions</option></select></div><p class="mini">${cc.length} definition cards · ${pinCount} diagram labels available</p><button class="btn full" id="startQuiz">Start quiz →</button></div><div class="card"><div class="featureIcon">🗂️</div><h3>Flashcards</h3><p>Learn the terminology first. Tap a card to flip it and decide whether you know the answer.</p><div class="actionrow"><button class="btn secondary" id="startFlash">Study ${cc.length} cards →</button></div><p class="mini">Great for muscles, bones, blood vessels, organs and physiology terms.</p></div></div><div class="sectiontop"><h3>Add a fact for better questions</h3></div><div class="card"><p class="mini">If PowerPoint bullet points don't include clear definitions, add a term and explanation manually. It will appear in your study guide and quizzes.</p><div class="cols"><div class="field"><label class="label" for="cardTerm">Term</label><input class="input" id="cardTerm" placeholder="e.g. Renal cortex"></div><div class="field"><label class="label" for="cardDefinition">Definition / function</label><input class="input" id="cardDefinition" placeholder="e.g. outer region of the kidney"></div></div><button class="btn secondary" id="addCard">＋ Add fact</button>${data.customCards.length?`<div class="sectiontop"><h3>Your custom cards</h3></div><div class="items">${data.customCards.map(c=>`<div class="item"><div><strong>${esc(c.term)}</strong><p>${esc(short(c.definition,130))}</p></div><button class="btn small danger" data-remcard="${esc(c.id)}">Delete</button></div>`).join('')}</div>`:''}</div>${data.history.length?`<div class="sectiontop"><h3>Previous practice</h3></div><div class="items">${data.history.slice(-5).reverse().map(s=>`<div class="item"><div><strong>${esc(s.mode)} practice · ${s.correct}/${s.total} reviewed</strong><p>${esc(s.date)}</p></div><span class="tag">${Math.round(100*s.correct/Math.max(1,s.total))}%</span></div>`).join('')}</div>`:''}`}
function quizAvailable(){const c=cards(),p=data.diagrams.flatMap(d=>d.pins.map(pin=>({diagram:d,pin})));return {c,p}}
function matchingQuestion(c){let items=shuffle(c).slice(0,Math.min(4,c.length));let defs=shuffle(items);return {type:'matching',items,defs,key:'Match each term with its correct definition'}}
function buildQuestion(type,items,pins){if(type==='diagram'){const x=shuffle(pins)[0];return x?{type,diagramId:x.diagram.id,pinId:x.pin.id,term:x.pin.label,key:`Tap the location of ${x.pin.label}`}:null}if(type==='matching')return items.length>=3?matchingQuestion(items):null;const item=shuffle(items)[0];if(!item)return null;if(type==='written')return {type,item,term:item.term,key:`Explain “${item.term}” in your own words.`};if(type==='fill')return {type,item,term:item.term,key:`Fill in the blank: _____ — ${item.definition}`};if(type==='mc'){if(items.length<4)return null;const opts=shuffle([item,...shuffle(items.filter(x=>x.term!==item.term)).slice(0,3)]);if(opts.length!==4)return null;return {type,item,options:opts,key:`Which term matches this definition?\n${item.definition}`}}if(type==='truefalse'){const wrong=items.length>1&&Math.random()<.5;const rhs=wrong?shuffle(items.filter(x=>x.term!==item.term))[0]:item;return {type,item,stmt:rhs.definition,yes:!wrong,key:`True or false: “${item.term}” — ${rhs.definition}`}}return null}
function createQuiz(mode,count,diagramId){const {c,p}=quizAvailable(),pins=diagramId?p.filter(q=>q.diagram.id===diagramId):p;if(mode==='diagram'&&!pins.length){toast('Add diagram labels first.');navTo('diagrams');return}if(mode!=='diagram'&&!c.length&&!(mode==='mixed'&&pins.length)){toast('Add definitions or diagram labels first.');navTo('library');return}const questions=[];const menu=['written','fill','truefalse','matching','diagram','mc'];let availability=menu.filter(m=>(m==='diagram'?pins.length>0:m==='matching'?c.length>=3:m==='mc'?c.length>=4:c.length>0));if(mode!=='mixed'&&!availability.includes(mode)){toast('Not enough material for that format. Try Mixed or add more cards.');return}for(let i=0;i<count;i++){let typ=mode==='mixed'?shuffle(availability)[0]:mode;if(mode==='mixed'&&questions.length){const counts={};for(const q of questions)counts[q.type]=(counts[q.type]||0)+1;const ranked=[...availability].sort((a,b)=>(counts[a]||0)-(counts[b]||0));typ=ranked[Math.floor(Math.random()*Math.min(3,ranked.length))]}const q=buildQuestion(typ,c,pins);if(q)questions.push(q)}if(!questions.length){toast('Could not build questions from this material.');return}quiz={mode,questions,index:0,correct:0,answered:false,revealed:false,selected:null,pick:null};active='quiz';render();window.scrollTo(0,0)}
function quizHeader(){return `<div class="row spread" style="margin-bottom:16px"><button class="btn ghost small" id="quitQuiz">← Exit quiz</button><span class="tag mint">${quiz.correct} correct / ${quiz.index} graded</span></div><div class="quizMeta"><span>QUESTION ${quiz.index+1} / ${quiz.questions.length}</span><span>${esc(quiz.mode.toUpperCase())} PRACTICE</span></div><div class="progress"><span style="width:${quiz.index/quiz.questions.length*100}%"></span></div>`}
function quizView(){if(!quiz)return practice();if(quiz.index>=quiz.questions.length)return quizResult();const q=quiz.questions[quiz.index];let inner='';if(q.type==='mc'){inner=`<p class="tag">Multiple choice</p><h3 class="quizTitle" style="white-space:pre-wrap">${esc(q.key)}</h3><div class="answerGrid">${q.options.map((o,i)=>`<button class="answerBtn ${quiz.answered?(o.term===q.item.term?'correct':quiz.selected===i?'wrong':''):''}" data-mc="${i}" ${quiz.answered?'disabled':''}>${String.fromCharCode(65+i)}. ${esc(o.term)}</button>`).join('')}</div>`}else if(q.type==='truefalse'){inner=`<p class="tag">True or false</p><h3 class="quizTitle">${esc(q.key)}</h3><div class="answerGrid"><button class="answerBtn ${quiz.answered?(q.yes?'correct':quiz.selected===true?'wrong':''):''}" data-tf="true" ${quiz.answered?'disabled':''}>True</button><button class="answerBtn ${quiz.answered?(!q.yes?'correct':quiz.selected===false?'wrong':''):''}" data-tf="false" ${quiz.answered?'disabled':''}>False</button></div>`}else if(q.type==='fill'){inner=`<p class="tag">Fill in the blank</p><h3 class="quizTitle">${esc(q.key)}</h3><form id="fillForm"><input class="input" id="fillAnswer" autocomplete="off" placeholder="Type the missing term" aria-label="Answer" ${quiz.answered?'disabled':''}><div class="actionrow"><button class="btn" ${quiz.answered?'disabled':''}>Check answer</button></div></form>`}else if(q.type==='written'){inner=`<p class="tag">Written recall</p><h3 class="quizTitle">${esc(q.key)}</h3><textarea class="textarea" id="writtenAnswer" rows="4" placeholder="Explain it from memory, then compare with your notes..." ${quiz.answered?'disabled':''}></textarea>${!quiz.answered?'<div class="actionrow"><button class="btn" id="reveal">Reveal reference answer</button></div>':''}`}else if(q.type==='matching'){inner=`<p class="tag">Matching</p><h3 class="quizTitle">Match each term with its meaning</h3><div class="stack">${q.items.map((item,i)=>`<div class="surface"><label class="label" for="match${i}">${i+1}. ${esc(item.term)}</label><select class="select matchselect" id="match${i}" data-matchrow="${i}" ${quiz.answered?'disabled':''}><option value="">Choose a definition</option>${q.defs.map((d,j)=>`<option value="${j}" ${quiz.pick?.[i]===String(j)?'selected':''}>${String.fromCharCode(65+j)}. ${esc(short(d.definition,125))}</option>`).join('')}</select></div>`).join('')}</div>${quiz.answered?'':'<div class="actionrow"><button class="btn" id="checkMatching">Check all matches</button></div>'}`}else if(q.type==='diagram'){const d=data.diagrams.find(x=>x.id===q.diagramId);if(!d){quiz.index++;return quizView()}inner=`<p class="tag">Visual anatomy</p><h3 class="quizTitle">Tap the ${esc(q.term)}</h3><div class="diagramQuiz" id="quizDiagram"><img src="${d.data}" alt="Diagram: ${esc(d.name)}">${quiz.answered?(()=>{const p=d.pins.find(x=>x.id===q.pinId);return p?`<span class="pin" style="left:${p.x*100}%;top:${p.y*100}%">✓</span>`:''})():''}</div><p class="imageHelp">Tap directly on the structure in the image. This diagram was labeled by you.</p>`}let feedback='';if(quiz.answered){let msg=q.type==='diagram'?`Correct structure: ${q.term}`:q.type==='matching'?q.items.map(item=>`${item.term}: ${item.definition}`).join('\n'):q.type==='written'?q.item.definition:q.type==='truefalse'?`From your notes: ${q.item.term}: ${q.item.definition}`:q.item.term+': '+q.item.definition;feedback=`<div class="quizAnswer ${quiz.selected===false?'bad':''}"><strong>${q.type==='written'?'Reference answer':quiz.selected===true?'✓ Correct':'Review this answer'}</strong><div style="margin-top:7px">${esc(msg)}</div>${q.type==='written'?`<div class="actionrow"><button class="btn small" data-self="yes">I knew it</button><button class="btn small secondary" data-self="no">Needs practice</button></div>`:''}</div>`}return `${quizHeader()}<div class="quizBox" style="margin-top:18px">${inner}${feedback}${quiz.answered&&q.type!=='written'?'<div class="actionrow"><button class="btn" id="nextQuestion">Next question →</button></div>':''}</div><p class="mini" style="margin-top:12px">Generated strictly from your uploaded study notes and annotated images. Written explanations are self-checked.</p>`}
function quizResult(){return `<span class="eyebrow">Session complete</span><h1>Practice makes <span class="accent">progress.</span></h1><div class="card"><div class="statvalue">${quiz.correct} <span class="muted" style="font-size:18px">/ ${quiz.questions.length}</span></div><p>Questions marked correct in this session. A written answer counted only when you marked it yourself. Some matching questions count as one.</p><div class="actionrow"><button class="btn" id="newQuiz">Another quiz</button><button class="btn secondary" data-go="guide">Review study guide</button></div></div>`}
function answerQuiz(correct,selected){if(quiz.answered)return;quiz.answered=true;quiz.selected=correct;quiz.pick=selected;quiz.correct+=correct?1:0;render()}
function nextQuiz(){quiz.index++;if(quiz.index>=quiz.questions.length){data.history.push({mode:quiz.mode,date:savedate(),correct:quiz.correct,total:quiz.questions.length});data.history=data.history.slice(-25);saveSoon()}render()}
function flashView(){const c=cards(),arr=flash.order.filter(id=>c.some(x=>x.id===id||x.term===id));const item=c.find(x=>x.id===arr[flash.i]||x.term===arr[flash.i]);if(!item)return `<div class="empty"><div class="emoji">🎉</div><h3>You've reviewed the deck!</h3><p>You made it through ${arr.length} flashcards. Come back later to strengthen your memory.</p><div class="actionrow" style="justify-content:center"><button class="btn" id="restartFlash">Study again</button><button class="btn secondary" data-go="practice">Practice menu</button></div></div>`;return `<div class="row spread"><button class="btn small ghost" data-go="practice">← Practice</button><span class="tag">CARD ${flash.i+1} / ${arr.length}</span></div><div class="sectiontop"><h3>Remember before revealing</h3></div><div class="flash" id="flipFlash" role="button" tabindex="0"><span class="eyebrow">${flash.shown?'THE ANSWER':'THE TERM'}</span><h2>${flash.shown?esc(item.definition):esc(item.term)}</h2><span class="mini">${flash.shown?'From: '+esc(item.source):'Tap to flip ↻'}</span></div><div class="actionrow"><button class="btn secondary" id="prevFlash" ${flash.i===0?'disabled':''}>← Previous</button>${flash.shown?'<button class="btn secondary" id="retryFlash">Needs practice</button><button class="btn" id="knowFlash">Got it ✓</button>':'<button class="btn" id="showFlash">Reveal answer</button>'}</div>`}
function render(){renderNav();const p=$('#page');p.innerHTML=active==='home'?home():active==='library'?library():active==='diagrams'?editorId?editDiagram():diagrams():active==='guide'?guideHTML():active==='practice'?practice():active==='quiz'?quizView():active==='flash'?flashView():home();bindUI()}
function bindUI(){$$('#page [data-go]').forEach(b=>b.onclick=()=>navTo(b.dataset.go));if(active==='home')$('#demo').onclick=addDemo;if(active==='library')bindLibrary();if(active==='diagrams')bindDiagrams();if(active==='guide'){if($('#printGuide'))$('#printGuide').onclick=()=>{$('#printPage').innerHTML=guideHTML(true);window.print()};if($('#downloadGuide'))$('#downloadGuide').onclick=()=>fileDownload(guideText(),'anatomiq-study-guide.txt')};if(active==='practice')bindPractice();if(active==='quiz')bindQuiz();if(active==='flash')bindFlash()}
function showDocument(s){const ov=$('#overlay');ov.innerHTML=`<div class="loading"><div class="card" style="width:100%;max-height:88vh;overflow:auto;text-align:left"><div class="row spread"><strong>${esc(s.name)}</strong><button class="btn small secondary" id="closeDoc">Close</button></div><p class="mini">Extracted text · ${s.text.length} characters</p><pre class="documentText" style="max-height:58vh">${esc(s.text||'No readable text was extracted.')}</pre></div></div>`;$('#closeDoc').onclick=()=>ov.innerHTML=''}
async function compressImage(f){return new Promise((res,rej)=>{const reader=new FileReader;reader.onload=()=>{const img=new Image;img.onload=()=>{let w=img.naturalWidth,h=img.naturalHeight;if(!w||!h)return rej(new Error('Unsupported image'));const scale=Math.min(1,1440/Math.max(w,h));w=Math.round(w*scale);h=Math.round(h*scale);const c=document.createElement('canvas');c.width=w;c.height=h;const ctx=c.getContext('2d');ctx.drawImage(img,0,0,w,h);res(c.toDataURL('image/jpeg',.8))};img.onerror=()=>rej(new Error('Cannot read that image'));img.src=reader.result};reader.onerror=()=>rej(reader.error);reader.readAsDataURL(f)})}
const waitLibraries=(name,ms=8000)=>new Promise((resolve,reject)=>{const st=Date.now(),t=setInterval(()=>{if(window[name]){clearInterval(t);resolve(window[name])}else if(Date.now()-st>ms){clearInterval(t);reject(new Error(`Document reader unavailable (${name}). Check your internet connection and retry.`))}},100)});
async function fromPptx(file){const JSZip=await waitLibraries('JSZip'),zip=await JSZip.loadAsync(await file.arrayBuffer());const keys=Object.keys(zip.files).filter(x=>/^ppt\/slides\/slide\d+\.xml$/.test(x)).sort((a,b)=>parseInt(a.match(/slide(\d+)/)[1])-parseInt(b.match(/slide(\d+)/)[1]));const slides=[];for(const path of keys.slice(0,130)){const doc=new DOMParser().parseFromString(await zip.file(path).async('string'),'application/xml');let lines=[];for(const p of Array.from(doc.getElementsByTagName('*')).filter(x=>x.localName==='p')){const txt=Array.from(p.getElementsByTagName('*')).filter(n=>n.localName==='t').map(n=>n.textContent).join(' ').trim();if(txt)lines.push(txt)}slides.push(`Slide ${slides.length+1}\n${lines.join('\n')}`)}const images=[];const imgKeys=Object.keys(zip.files).filter(x=>/^ppt\/media\/[^/]+\.(?:png|jpe?g|webp)$/i.test(x)).slice(0,12);for(const path of imgKeys){try{const blob=await zip.file(path).async('blob');if(blob.size>8500000)continue;const mime=/\.png$/i.test(path)?'image/png':'image/jpeg';const img=new File([blob],path.split('/').pop(),{type:mime});images.push({id:id(),name:`${file.name}: ${img.name}`,data:await compressImage(img),pins:[]})}catch(e){console.warn('Skipping embedded image',e)}}return {text:slides.join('\n\n'),diagrams:images}}
async function fromPdf(file,wantPages){const lib=await waitLibraries('pdfjsLib');lib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';const doc=await lib.getDocument({data:new Uint8Array(await file.arrayBuffer())}).promise;let lines=[],images=[];for(let i=1;i<=Math.min(95,doc.numPages);i++){const page=await doc.getPage(i),content=await page.getTextContent();let line='';for(const item of content.items){line+=item.str+(item.hasEOL?'\n':' ')}lines.push(`Page ${i}\n${line}`);if(wantPages&&i<=Math.min(6,doc.numPages)){try{const vp=page.getViewport({scale:1.2});const cn=document.createElement('canvas');cn.width=Math.round(vp.width);cn.height=Math.round(vp.height);await page.render({canvasContext:cn.getContext('2d'),viewport:vp}).promise;images.push({id:id(),name:`${file.name} — page ${i}`,data:cn.toDataURL('image/jpeg',.75),pins:[]})}catch(e){console.warn('PDF page image not saved',e)}}}return {text:lines.join('\n\n'),diagrams:images}}
async function parseFile(file,wantPdfImages){const name=file.name;const ext=name.split('.').pop().toLowerCase();if(file.type.startsWith('image/')||['png','jpg','jpeg','webp','gif','bmp'].includes(ext)){const img=await compressImage(file);return {source:null,diagrams:[{id:id(),name,data:img,pins:[]}]}}let text='',diagrams=[];if(ext==='pptx'){const result=await fromPptx(file);text=result.text;diagrams=result.diagrams}else if(ext==='pdf'){const result=await fromPdf(file,wantPdfImages);text=result.text;diagrams=result.diagrams}else if(ext==='docx'){const m=await waitLibraries('mammoth');text=(await m.extractRawText({arrayBuffer:await file.arrayBuffer()})).value}else if(['txt','md','csv'].includes(ext)||file.type.startsWith('text/'))text=await file.text();else throw new Error('Unsupported file type. Use PDF, PPTX, DOCX, TXT, MD, CSV or an image.');return {source:{id:id(),name,type:ext.toUpperCase(),text:text.slice(0,400000),created:savedate()},diagrams}}
function overlayLoading(label){$('#overlay').innerHTML=`<div class="loading"><div class="card"><div class="spinner"></div><h3>${esc(label)}</h3><p>Processing locally in your browser. Keep this page open.</p></div></div>`}
async function importFiles(files){if(!files.length)return;const wants=$('#pdfVisual')?.checked??true;let success=0,errs=[];overlayLoading('Reading your study files...');for(let i=0;i<files.length;i++){try{if(files[i].size>35000000)throw new Error('File too big (35 MB max)');const out=await parseFile(files[i],wants);if(out.source)data.sources.push(out.source);data.diagrams.push(...out.diagrams);success++}catch(e){console.error(e);errs.push(`${files[i].name}: ${e.message||e}`)}}saveSoon();$('#overlay').innerHTML='';render();toast(`${success} file(s) added${errs.length?' · '+errs.length+' failed':''}`);if(errs.length){const box=document.createElement('div');box.className='notice warn';box.style.marginTop='17px';box.textContent=errs.join(' | ');$('#page').prepend(box)}}
function bindLibrary(){const inp=$('#files'),drop=$('#drop');drop.onclick=()=>inp.click();drop.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();inp.click()}};inp.onchange=()=>importFiles(Array.from(inp.files));drop.ondragover=e=>{e.preventDefault();drop.style.borderColor='var(--accent)'};drop.ondragleave=()=>drop.style.borderColor='';drop.ondrop=e=>{e.preventDefault();drop.style.borderColor='';importFiles(Array.from(e.dataTransfer.files))};$('#saveNotes').onclick=()=>{const name=$('#notesTitle').value.trim()||'My anatomy notes',text=$('#notesText').value.trim();if(text.length<16)return toast('Paste a little more note text first.');data.sources.push({id:id(),name,type:'NOTES',text,created:savedate()});saveSoon();render();toast('Notes saved')};$$('[data-viewdoc]').forEach(b=>b.onclick=()=>showDocument(data.sources.find(s=>s.id===b.dataset.viewdoc)));$$('[data-delete-source]').forEach(b=>b.onclick=()=>{if(confirm('Delete this study document?')){data.sources=data.sources.filter(s=>s.id!==b.dataset.deleteSource);saveSoon();render()}});$$('[data-editdiagram]').forEach(b=>b.onclick=()=>{editorId=b.dataset.editdiagram;active='diagrams';render()});$('#export').onclick=()=>fileDownload(JSON.stringify({format:'anatomiq-v1',date:savedate(),data},null,2),`anatomiq-backup-${savedate()}.json`,'application/json');$('#backupFile').onchange=async e=>{const f=e.target.files?.[0];if(!f)return;try{const v=JSON.parse(await f.text());if(v.format!=='anatomiq-v1'||!v.data||!Array.isArray(v.data.sources)||!Array.isArray(v.data.diagrams)||!Array.isArray(v.data.customCards))throw new Error('This does not look like an AnatomIQ backup.');if(!confirm('Replace your current study library with this backup?'))return;data={sources:v.data.sources,diagrams:v.data.diagrams,customCards:v.data.customCards,reviews:v.data.reviews||{},history:v.data.history||[]};saveSoon();render();toast('Backup restored')}catch(err){toast('Could not restore: '+err.message)}}}
function bindDiagrams(){if(editorId){const d=data.diagrams.find(x=>x.id===editorId);$('#backDia').onclick=()=>{editorId=null;render()};$('#markCanvas').onclick=e=>{if(e.target.classList.contains('pin'))return;const label=$('#pinName').value.trim(),note=$('#pinNote').value.trim();if(!label)return toast('Type a structure name first.');const rect=$('#markCanvas img').getBoundingClientRect(),x=(e.clientX-rect.left)/rect.width,y=(e.clientY-rect.top)/rect.height;if(x<0||x>1||y<0||y>1)return;d.pins.push({id:id(),label,note,x,y});saveSoon();render();$('#pinName').focus();toast('Label pinned to image ✓')};$$('[data-rmpin]').forEach(b=>b.onclick=()=>{d.pins=d.pins.filter(p=>p.id!==b.dataset.rmpin);saveSoon();render()});$('#practiceDia').onclick=()=>createQuiz('diagram',Math.min(10,d.pins.length*2),d.id);$('#deleteDia').onclick=()=>{if(confirm('Delete this image and all its labels?')){data.diagrams=data.diagrams.filter(x=>x.id!==d.id);editorId=null;saveSoon();render()}}}else $$('[data-editdiagram]').forEach(b=>b.onclick=()=>{editorId=b.dataset.editdiagram;render()})}
function bindPractice(){$('#startQuiz').onclick=()=>createQuiz($('#quizMode').value,+$('#quizCount').value);$('#startFlash').onclick=()=>{const c=cards();if(!c.length)return toast('Add some definitions first.');flash={i:0,shown:false,order:shuffle(c).map(c=>c.id)};active='flash';render()};$('#addCard').onclick=()=>{const term=$('#cardTerm').value.trim(),definition=$('#cardDefinition').value.trim();if(term.length<2||definition.length<8)return toast('Add a term and a useful explanation.');data.customCards.push({id:id(),term,definition,source:'My cards'});saveSoon();render();toast('Fact added to quizzes')};$$('[data-remcard]').forEach(b=>b.onclick=()=>{data.customCards=data.customCards.filter(x=>x.id!==b.dataset.remcard);saveSoon();render()})}
function bindQuiz(){if(!quiz)return;$('#quitQuiz')?.addEventListener('click',()=>{if(confirm('Exit this quiz?')){quiz=null;active='practice';render()}});if($('#newQuiz'))$('#newQuiz').onclick=()=>{quiz=null;active='practice';render()};const q=quiz.questions[quiz.index];if(!q||quiz.answered){$('#nextQuestion')?.addEventListener('click',nextQuiz);$$('[data-self]').forEach(b=>b.onclick=()=>{if(b.dataset.self==='yes')quiz.correct++;nextQuiz()});return}$$('[data-mc]').forEach(b=>b.onclick=()=>answerQuiz(q.options[+b.dataset.mc].term===q.item.term,+b.dataset.mc));$$('[data-tf]').forEach(b=>b.onclick=()=>answerQuiz((b.dataset.tf==='true')===q.yes,b.dataset.tf==='true'));$('#fillForm')?.addEventListener('submit',e=>{e.preventDefault();const val=$('#fillAnswer').value;if(!val.trim())return;answerQuiz(normalize(val)===normalize(q.item.term),val)});$('#reveal')?.addEventListener('click',()=>{quiz.answered=true;quiz.selected=null;render()});$('#checkMatching')?.addEventListener('click',()=>{const choices=$$('.matchselect').map(x=>x.value);if(choices.some(x=>x===''))return toast('Match all terms first.');quiz.answered=true;quiz.pick=choices;const good=q.items.every((x,i)=>q.defs[+choices[i]].term===x.term);quiz.selected=good;quiz.correct+=good?1:0;render()});$('#quizDiagram')?.addEventListener('click',e=>{const d=data.diagrams.find(x=>x.id===q.diagramId),pin=d?.pins.find(x=>x.id===q.pinId);if(!pin)return;const r=$('#quizDiagram img').getBoundingClientRect(),x=(e.clientX-r.left)/r.width,y=(e.clientY-r.top)/r.height;const distance=Math.hypot((x-pin.x)*r.width,(y-pin.y)*r.height);answerQuiz(distance<=Math.max(24,Math.min(r.width,r.height)*.105),{x,y})})}
function bindFlash(){$('#restartFlash')?.addEventListener('click',()=>{flash.i=0;flash.shown=false;render()});const flip=()=>{flash.shown=!flash.shown;render()};$('#flipFlash')?.addEventListener('click',flip);$('#flipFlash')?.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();flip()}});$('#showFlash')?.addEventListener('click',flip);$('#prevFlash')?.addEventListener('click',()=>{flash.i--;flash.shown=false;render()});for(const type of ['retryFlash','knowFlash'])$('#'+type)?.addEventListener('click',()=>{const c=cards(),key=flash.order[flash.i];data.reviews[key]=(data.reviews[key]||0)+(type==='knowFlash'?1:-1);saveSoon();flash.i=flash.i+1;flash.shown=false;render();if(flash.i===flash.order.length-1)toast('Almost done — last card!')})}
function demoSvg(){const svg=`<svg xmlns="http://www.w3.org/2000/svg" width="800" height="560" viewBox="0 0 800 560"><rect width="800" height="560" rx="35" fill="#0e2538"/><text x="400" y="51" fill="#afc8da" font-family="Arial" font-size="23" text-anchor="middle">BLOOD FLOW • SIMPLIFIED HEART SCHEMATIC</text><path d="M210 110 C110 110 70 210 135 300 L295 468 C335 515 400 515 430 485 L665 265 C725 193 655 96 570 112 C495 124 445 170 402 208 C351 153 290 104 210 110Z" fill="#2b4b69" opacity=".55" stroke="#6882a0" stroke-width="6"/><rect x="165" y="215" width="177" height="108" rx="30" fill="#467baf" stroke="#a9d3fb" stroke-width="5"/><rect x="165" y="343" width="177" height="111" rx="30" fill="#24628c" stroke="#a9d3fb" stroke-width="5"/><rect x="461" y="215" width="177" height="108" rx="30" fill="#be5c6f" stroke="#ffc2c6" stroke-width="5"/><rect x="461" y="343" width="177" height="111" rx="30" fill="#9d344c" stroke="#ffc2c6" stroke-width="5"/><path d="M252 112v103M252 323v20M545 150v65M545 323v20M638 400h105V116" fill="none" stroke="#a6cef0" stroke-width="18" stroke-linecap="round"/><path d="M545 112v-53h121" fill="none" stroke="#ffb4be" stroke-width="17" stroke-linecap="round"/><path d="M545 323h-100v-50h-103" fill="none" stroke="#d8afc1" stroke-width="10" stroke-dasharray="15 9"/><path d="M342 394h119" stroke="#aac1d3" stroke-width="10" stroke-dasharray="15 12"/><text x="252" y="280" fill="#d8efff" text-anchor="middle" font-family="Arial" font-size="19">RA</text><text x="252" y="408" fill="#e2f4ff" text-anchor="middle" font-family="Arial" font-size="19">RV</text><text x="550" y="280" fill="#ffe8e7" text-anchor="middle" font-family="Arial" font-size="19">LA</text><text x="550" y="408" fill="#ffe8e7" text-anchor="middle" font-family="Arial" font-size="19">LV</text><text x="400" y="523" fill="#92afc4" text-anchor="middle" font-family="Arial" font-size="16">Training illustration — not anatomical scale or position</text></svg>`;return 'data:image/svg+xml;charset=utf-8,'+encodeURIComponent(svg)}
function addDemo(){if(data.sources.some(s=>s.name==='Demo — Cardiovascular basics'))return toast('Demo already loaded');data.sources.push({id:id(),name:'Demo — Cardiovascular basics',type:'DEMO',created:savedate(),text:`Right atrium: Receives deoxygenated blood returning from the body via the venae cavae.\nRight ventricle: Pumps deoxygenated blood toward the lungs through the pulmonary trunk.\nLeft atrium: Receives oxygenated blood returning from the lungs through the pulmonary veins.\nLeft ventricle: Pumps oxygenated blood into the aorta for systemic circulation.\nAorta: Main artery carrying blood from the left ventricle into systemic circulation.\nPulmonary veins: Transport oxygenated blood from the lungs to the left atrium.\nVenae cavae: Large veins returning deoxygenated blood from the body into the right atrium.\nInterventricular septum: Muscular wall separating the right and left ventricles.`});data.diagrams.push({id:id(),name:'Demo — Heart chambers (schematic)',data:demoSvg(),pins:[{id:id(),label:'Right atrium',note:'receives systemic venous blood',x:.316,y:.48},{id:id(),label:'Right ventricle',note:'pumps blood to lungs',x:.315,y:.71},{id:id(),label:'Left atrium',note:'receives pulmonary venous blood',x:.69,y:.48},{id:id(),label:'Left ventricle',note:'pumps into aorta',x:.69,y:.71}]});saveSoon();navTo('practice');toast('Sample heart notes and diagram loaded!')}
async function init(){try{db=await openDB();const stored=await dbGet('data');if(stored&&Array.isArray(stored.sources))data={...data,...stored}}catch(e){storageGood=false;console.warn(e);$('#saveStatus').textContent='! SAVING UNAVAILABLE';toast('Private device storage is unavailable. Backup exports may still work.')}render()};init();
})();
